<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Title is overwritten by detail.js once the project loads -->
  <title>Project — Sharang Sharma</title>
  <meta name="description" content="Project detail — Sharang Sharma, designer & creative coder." />
  <link rel="stylesheet" type="text/css" href="style.css">
  <link rel="stylesheet" type="text/css" href="project.css">
</head>

<body>
  <div class="cursor" id="cursor"></div>

  <div class="main-wrapper">
    <!-- ── Header ───────────────────────────────────────────── -->
    <header class="site-header">
      <div class="brand"><a href="index.html">sharang sharma</a></div>
      <div class="header-right">
        <nav class="main-nav">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="index.html">Projects</a>
          <a href="#">Tools</a>
          <a href="mailto:hello@example.com">Contact</a>
        </nav>
        <div class="status">
          <span>New Delhi, IN</span>
          <span class="dot" aria-hidden="true"></span>
        </div>
      </div>
    </header>

    <!-- ── Project ──────────────────────────────────────────── -->
    <article class="project" id="project" hidden>
      <header class="project-head">
        <h1 class="project-title" id="project-title"></h1>
        <dl class="project-meta">
          <div class="meta-item">
            <dt>Year</dt>
            <dd id="project-year"></dd>
          </div>
          <div class="meta-item">
            <dt>Role</dt>
            <dd id="project-role"></dd>
          </div>
          <div class="meta-item" id="project-client-item">
            <dt>Client</dt>
            <dd id="project-client"></dd>
          </div>
        </dl>
      </header>

      <div class="project-description" id="project-description"></div>
      <div class="project-tags" id="project-tags"></div>
      <div class="project-media" id="project-media"></div>
    </article>

    <div class="projects-status" id="project-status"></div>

    <!-- ── Footer ───────────────────────────────────────────── -->
    <footer class="site-footer">
      <span data-clock="datetime"></span>
      <div class="footer-socials">
        <a href="https://instagram.com/" target="_blank" rel="noopener">Instagram</a>
        <a href="https://linkedin.com/" target="_blank" rel="noopener">LinkdIn</a>
        <a href="mailto:hello@example.com">Email</a>
      </div>
    </footer>
  </div>

  <!-- ── Scripts ──────────────────────────────────────────── -->
  <script src="sanity.js"></script>
  <script src="detail.js"></script>
  <script src="site.js"></script>
</body>

</html>
